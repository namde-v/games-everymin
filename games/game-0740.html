<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tightrope Acrobatic Balance</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0b1020; color: #f8f4e8; font-family: Arial, Helvetica, sans-serif; overflow: hidden; touch-action: none; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 18%, #2b3a66 0%, #121a33 48%, #080c1a 100%); }
  #gameBox { position: relative; width: min(96vw, 900px); }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 900 / 560; background: linear-gradient(#1b2a52, #0d1730 55%, #0a0f22); border: 3px solid #ffd166; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; font-weight: bold; text-shadow: 1px 1px 2px #000; pointer-events: none; }
  .pill { background: rgba(0,0,0,.55); border: 1px solid #ffd166; padding: 7px 10px; border-radius: 20px; font-size: 14px; white-space: nowrap; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; background: rgba(3,6,18,.78); border-radius: 14px; padding: 20px; }
  #overlay.hidden { display: none; }
  .card { max-width: 620px; }
  h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); color: #ffd166; line-height: 1.05; }
  h2 { margin: 0 0 10px; font-size: 34px; color: #ffd166; }
  p { line-height: 1.55; margin: 8px 0; }
  .big { font-size: 19px; }
  button { cursor: pointer; border: 0; border-radius: 12px; background: #ffd166; color: #1a1200; font-size: 20px; font-weight: 900; padding: 14px 26px; margin-top: 12px; box-shadow: 0 5px 0 #b8860b; }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8860b; }
  button.secondary { background: #e9e9e9; box-shadow: 0 5px 0 #888; margin-left: 8px; }
  .keys { display: inline-block; background: #222; border: 1px solid #777; border-bottom-width: 3px; border-radius: 6px; padding: 2px 8px; font-family: monospace; }
  #controls { position: absolute; bottom: 12px; left: 0; right: 0; display: none; justify-content: center; gap: 10px; }
  #controls.show { display: flex; }
  #controls button { font-size: 26px; padding: 14px 22px; margin: 0; background: rgba(255,209,102,.92); }
  #windWarn { color: #ff7b72; font-weight: bold; min-height: 22px; }
  @media (max-width: 600px) { .pill { font-size: 12px; padding: 5px 8px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="gameBox">
    <canvas id="game" width="900" height="560"></canvas>
    <div id="hud">
      <span class="pill" id="scoreHud">Score: 0</span>
      <span class="pill" id="flagHud">Flags: 0 / 8</span>
      <span class="pill" id="livesHud">Lives: 3</span>
      <span class="pill" id="statusHud">Status: Ready</span>
    </div>
    <div id="overlay">
      <div class="card" id="card"></div>
    </div>
    <div id="controls">
      <button type="button" id="leftBtn" aria-label="Lean left">◀ LEAN</button>
      <button type="button" id="rightBtn" aria-label="Lean right">LEAN ▶</button>
    </div>
  </div>
</div>
<script>
(function() {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var card = document.getElementById('card');
  var scoreHud = document.getElementById('scoreHud');
  var flagHud = document.getElementById('flagHud');
  var livesHud = document.getElementById('livesHud');
  var statusHud = document.getElementById('statusHud');
  var controls = document.getElementById('controls');
  var leftBtn = document.getElementById('leftBtn');
  var rightBtn = document.getElementById('rightBtn');

  var state = 'title';
  var score = 0, lives = 3, flagsGot = 0, distance = 0, bestBalance = 0;
  var acrobat = { x: 70, tilt: 0, tiltVel: 0, lean: 0, walk: 0, bob: 0, falling: 0 };
  var wind = { force: 0, target: 0, timer: 0, gust: 0, label: 'Calm' };
  var flags = [];
  var particles = [];
  var keys = {};
  var audioCtx = null, masterGain = null;
  var lastTime = 0, elapsed = 0, message = '', messageTimer = 0;
  var shake = 0;

  function initFlags() {
    flags = [];
    for (var i = 0; i < 8; i++) {
      flags.push({ x: 155 + i * 95, taken: false, wave: Math.random() * 6.28 });
    }
  }
  function resetGame() {
    score = 0; lives = 3; flagsGot = 0; distance = 0; bestBalance = 0;
    acrobat = { x: 70, tilt: 0, tiltVel: 0, lean: 0, walk: 0, bob: 0, falling: 0 };
    wind = { force: 0, target: 0, timer: 1, gust: 0, label: 'Calm' };
    particles = []; elapsed = 0; message = ''; messageTimer = 0; shake = 0;
    initFlags();
    updateHud('Walking the rope');
  }
  function ensureAudio() {
    if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.12;
      masterGain.connect(audioCtx.destination);
    } catch (e) { audioCtx = null; }
  }
  function tone(freq, dur, type, vol, slide) {
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.5, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(masterGain); o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function playFlag() { tone(660, 0.12, 'triangle', 0.7); setTimeout(function(){ tone(880, 0.16, 'triangle', 0.7); }, 90); }
  function playFall() { tone(420, 0.45, 'sawtooth', 0.5, 90); }
  function playWin() { [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.22, 'triangle', 0.7); }, i * 120); }); }

  function showTitle() {
    state = 'title';
    controls.classList.remove('show');
    card.innerHTML = '<h1>🎪 Tightrope Acrobatic Balance</h1>' +
      '<p class="big">Cross the high wire, collect all 8 flags, and do not let the wind — or your own overcorrection — send you tumbling!</p>' +
      '<p><strong>How to Play:</strong> Walk forward automatically. Tap <span class="keys">◀</span> / <span class="keys">▶</span>, use <span class="keys">A</span> / <span class="keys">D</span> or arrow keys, or touch the on-screen buttons to lean against the wind. Small, gentle corrections win; big jerky leans build dangerous momentum.</p>' +
      '<p>Watch the wind meter and the red gust warning. Collect flags for 100 points each. You have 3 lives. Reach the far platform to win!</p>' +
      '<button type="button" id="startBtn">▶ Start Performance</button>';
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', startGame);
  }
  function showEnd(won) {
    state = won ? 'win' : 'over';
    controls.classList.remove('show');
    var title = won ? '🏆 Standing Ovation!' : '💥 Game Over';
    var text = won ? 'You crossed the rope and collected ' + flagsGot + ' of 8 flags. Final score: ' + score + '.' :
      'The acrobat took a final fall. You collected ' + flagsGot + ' of 8 flags and scored ' + score + '.';
    card.innerHTML = '<h2>' + title + '</h2><p class="big">' + text + '</p>' +
      '<p>Distance: ' + Math.floor(distance) + ' steps &nbsp;•&nbsp; Best balance streak: ' + Math.floor(bestBalance) + 's</p>' +
      '<button type="button" id="restartBtn">↻ Restart Now</button>';
    overlay.classList.remove('hidden');
    document.getElementById('restartBtn').addEventListener('click', startGame);
  }
  function startGame() {
    ensureAudio();
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    controls.classList.add('show');
    updateHud('Walking the rope');
    tone(520, 0.12, 'triangle', 0.6); setTimeout(function(){ tone(780, 0.15, 'triangle', 0.6); }, 110);
  }
  function updateHud(status) {
    scoreHud.textContent = 'Score: ' + score;
    flagHud.textContent = 'Flags: ' + flagsGot + ' / 8';
    livesHud.textContent = 'Lives: ' + lives;
    statusHud.textContent = 'Status: ' + status;
  }
  function burst(x, y, color) {
    for (var i = 0; i < 18; i++) {
      particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 220, vy: Math.random() * -180 - 20, life: 0.7 + Math.random() * 0.4, color: color });
    }
  }
  function fall() {
    if (state !== 'playing') return;
    state = 'falling';
    acrobat.falling = 0;
    playFall(); shake = 10;
    burst(acrobat.x, 235, '#ffd166');
    updateHud('Falling!');
  }
  function afterFall() {
    lives--;
    if (lives <= 0) { updateHud('Game Over'); showEnd(false); return; }
    acrobat.x = Math.max(70, acrobat.x - 110);
    acrobat.tilt = 0; acrobat.tiltVel = 0; acrobat.lean = 0; acrobat.falling = 0;
    wind.force = 0; wind.target = 0; wind.gust = 0;
    state = 'playing';
    updateHud('Recovered — keep going!');
    message = 'Careful! One life lost.'; messageTimer = 2.2;
  }

  function update(dt) {
    if (state === 'playing') {
      elapsed += dt;
      var leanInput = 0;
      if (keys['arrowleft'] || keys['a']) leanInput -= 1;
      if (keys['arrowright'] || keys['d']) leanInput += 1;
      if (leftHeld) leanInput -= 1;
      if (rightHeld) leanInput += 1;
      // Wind model: slowly changing base wind plus sharp gusts.
      wind.timer -= dt;
      if (wind.timer <= 0) {
        wind.target = (Math.random() - 0.5) * 1.7;
        wind.timer = 1.6 + Math.random() * 2.0;
        if (Math.random() < 0.38) {
          wind.gust = (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 1.2);
          wind.label = wind.gust > 0 ? 'GUST →' : '← GUST';
          message = 'Wind gust! Lean gently against it.'; messageTimer = 1.8;
        } else { wind.gust = 0; wind.label = Math.abs(wind.target) < 0.35 ? 'Calm' : (wind.target > 0 ? 'Breeze →' : '← Breeze'); }
      }
      wind.force += (wind.target + wind.gust - wind.force) * Math.min(1, dt * 2.2);
      // Physics: wind pushes tilt, player lean counters it, but too much lean creates momentum.
      var leanTarget = leanInput * 1.0;
      acrobat.lean += (leanTarget - acrobat.lean) * Math.min(1, dt * 10);
      acrobat.tiltVel += (wind.force * 0.95 - acrobat.lean * 1.15) * dt;
      acrobat.tiltVel *= Math.pow(0.985, dt * 60);
      acrobat.tilt += acrobat.tiltVel * dt * 2.4;
      // Gentle forward progress only while reasonably balanced.
      var stable = Math.abs(acrobat.tilt) < 0.55;
      if (stable) {
        acrobat.x += dt * 28;
        distance += dt * 28;
        score += dt * 2;
        bestBalance = Math.max(bestBalance, elapsed);
        acrobat.walk += dt * 10;
      }
      acrobat.bob = Math.sin(acrobat.walk) * 3;
      // Flags.
      for (var i = 0; i < flags.length; i++) {
        var f = flags[i];
        f.wave += dt * 6;
        if (!f.taken && Math.abs(acrobat.x - f.x) < 16) {
          f.taken = true; flagsGot++; score += 100; playFlag();
          burst(f.x, 210, '#4ade80');
          message = 'Flag collected! +100'; messageTimer = 1.4;
        }
      }
      if (messageTimer > 0) messageTimer -= dt;
      // Win at the far platform.
      if (acrobat.x >= 840) {
        score += 500 + lives * 150;
        playWin(); updateHud('Winner!');
        showEnd(true); return;
      }
      // Fall when tilt exceeds the safe limit — including overcorrection.
      if (Math.abs(acrobat.tilt) > 1.15) { fall(); return; }
      updateHud(wind.label + ' • Tilt ' + Math.round(Math.abs(acrobat.tilt) * 100) + '%');
    } else if (state === 'falling') {
      acrobat.falling += dt;
      if (acrobat.falling > 1.1) afterFall();
    }
    // Particles always update.
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(j, 1);
    }
    if (shake > 0) shake -= dt * 30;
  }

  function drawBackground() {
    ctx.fillStyle = '#0d1730'; ctx.fillRect(0, 0, 900, 560);
    ctx.fillStyle = '#ffd166';
    for (var i = 0; i < 45; i++) {
      var sx = (i * 67) % 900, sy = (i * 37) % 170;
      ctx.globalAlpha = 0.7; ctx.fillRect(sx, sy, 2, 2); ctx.globalAlpha = 1;
    }
    // Moon and clouds.
    ctx.beginPath(); ctx.arc(790, 70, 34, 0, Math.PI * 2); ctx.fillStyle = '#fff7cc'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.ellipse(180 + wind.force * 18, 82, 90, 20, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(540 + wind.force * 28, 58, 110, 22, 0, 0, Math.PI * 2); ctx.fill();
    // City silhouettes and ground far below.
    ctx.fillStyle = '#111c3d';
    ctx.fillRect(0, 470, 900, 90);
    ctx.fillStyle = '#1d2c58';
    for (var b = 0; b < 12; b++) { ctx.fillRect(b * 78 + 8, 400 - (b % 4) * 18, 52, 90); }
    ctx.fillStyle = '#ffe08a';
    for (var w = 0; w < 30; w++) { ctx.fillRect(20 + w * 29, 430 + (w % 3) * 16, 7, 8); }
    // Platforms.
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(20, 245, 90, 18); ctx.fillRect(790, 245, 90, 18);
    ctx.fillStyle = '#ffd166'; ctx.fillRect(20, 240, 90, 6); ctx.fillRect(790, 240, 90, 6);
  }
  function drawRopeAndFlags() {
    ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(110, 254); ctx.quadraticCurveTo(450, 268 + Math.sin(elapsed * 2) * 2, 790, 254); ctx.stroke();
    for (var i = 0; i < flags.length; i++) {
      var f = flags[i];
      if (f.taken) continue;
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(f.x, 255); ctx.lineTo(f.x, 208); ctx.stroke();
      ctx.fillStyle = (i % 2 === 0) ? '#ff5d5d' : '#4ade80';
      ctx.beginPath(); ctx.moveTo(f.x, 208); ctx.lineTo(f.x + 26, 216 + Math.sin(f.wave) * 3); ctx.lineTo(f.x, 224); ctx.closePath(); ctx.fill();
    }
  }
  function drawAcrobat() {
    var x = acrobat.x;
    var fallY = state === 'falling' ? acrobat.falling * acrobat.falling * 260 : 0;
    var y = 235 + acrobat.bob + fallY;
    var rot = acrobat.tilt * 0.55 + (state === 'falling' ? acrobat.falling * 2.2 : 0);
    ctx.save();
    ctx.translate(x, y);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.rotate(rot);
    // Balancing pole.
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-72, -28); ctx.lineTo(72, -28); ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(-72, -28, 7, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(72, -28, 7, 0, Math.PI * 2); ctx.fill();
    // Body.
    ctx.strokeStyle = '#ff5d5d'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 14); ctx.stroke();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.beginPath();
    var legSwing = Math.sin(acrobat.walk) * 8;
    ctx.moveTo(0, 14); ctx.lineTo(-9 + legSwing, 30); ctx.moveTo(0, 14); ctx.lineTo(9 - legSwing, 30); ctx.stroke();
    ctx.strokeStyle = '#ff5d5d'; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-15, 4); ctx.moveTo(0, -6); ctx.lineTo(15, 4); ctx.stroke();
    // Head.
    ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(0, -30, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, -38, 13, Math.PI, 0); ctx.fill();
    ctx.restore();
    // Safety net hint when falling.
    if (state === 'falling') {
      ctx.fillStyle = 'rgba(255,209,102,.25)'; ctx.fillRect(x - 70, 500, 140, 28);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.fillText('WHOA!', x, 490);
    }
  }
  function draw() {
    drawBackground();
    drawRopeAndFlags();
    drawAcrobat();
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 6, 6);
      ctx.globalAlpha = 1;
    }
    // Wind meter.
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(310, 500, 280, 34);
    ctx.fillStyle = '#444'; ctx.fillRect(320, 512, 260, 10);
    var wx = 450 + wind.force * 55;
    ctx.fillStyle = Math.abs(wind.force) > 1.2 ? '#ff5d5d' : '#4ade80';
    ctx.fillRect(Math.min(450, wx), 512, Math.max(4, Math.abs(wx - 450)), 10);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
    ctx.fillText('WIND  ←  →', 450, 498);
    // Balance meter.
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(30, 500, 220, 34);
    ctx.fillStyle = '#444'; ctx.fillRect(40, 512, 200, 10);
    var tiltW = Math.min(100, Math.abs(acrobat.tilt) * 87);
    ctx.fillStyle = Math.abs(acrobat.tilt) > 0.8 ? '#ff5d5d' : (Math.abs(acrobat.tilt) > 0.45 ? '#ffd166' : '#4ade80');
    ctx.fillRect(140 - tiltW / 2, 512, tiltW, 10);
    ctx.fillStyle = '#fff'; ctx.fillText('BALANCE', 140, 498);
    if (message && messageTimer > 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial'; ctx.fillText(message, 450, 360);
    }
    if (state === 'title') {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0, 0, 900, 560);
    }
  }
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    var dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  var leftHeld = false, rightHeld = false;
  function pressLeft(on) { leftHeld = on; if (on) ensureAudio(); }
  function pressRight(on) { rightHeld = on; if (on) ensureAudio(); }

  document.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k === 'enter' && (state === 'title' || state === 'win' || state === 'over')) startGame();
    if (['arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
  });
  document.addEventListener('keyup', function(e) { keys[e.key.toLowerCase()] = false; });
  document.addEventListener('click', function(e) { if (state === 'title') ensureAudio(); });
  leftBtn.addEventListener('mousedown', function() { pressLeft(true); });
  leftBtn.addEventListener('mouseup', function() { pressLeft(false); });
  leftBtn.addEventListener('mouseleave', function() { pressLeft(false); });
  leftBtn.addEventListener('touchstart', function(e) { e.preventDefault(); pressLeft(true); }, { passive: false });
  leftBtn.addEventListener('touchend', function(e) { e.preventDefault(); pressLeft(false); });
  rightBtn.addEventListener('mousedown', function() { pressRight(true); });
  rightBtn.addEventListener('mouseup', function() { pressRight(false); });
  rightBtn.addEventListener('mouseleave', function() { pressRight(false); });
  rightBtn.addEventListener('touchstart', function(e) { e.preventDefault(); pressRight(true); }, { passive: false });
  rightBtn.addEventListener('touchend', function(e) { e.preventDefault(); pressRight(false); });
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault(); ensureAudio();
    var rect = canvas.getBoundingClientRect();
    var touch = e.touches[0];
    var x = touch.clientX - rect.left;
    if (x < rect.width / 2) pressLeft(true); else pressRight(true);
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) { e.preventDefault(); pressLeft(false); pressRight(false); });
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (e.buttons === 1) { if (x < rect.width / 2) { pressLeft(true); pressRight(false); } else { pressRight(true); pressLeft(false); } }
  });
  canvas.addEventListener('mouseup', function() { pressLeft(false); pressRight(false); });
  canvas.addEventListener('click', function() { ensureAudio(); });

  resetGame();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
